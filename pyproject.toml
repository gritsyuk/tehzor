[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "tehzor"
dynamic = ["version"]
description = "Асинхронный Python-клиент Tehzor Public API и MCP-сервер для LLM-агентов"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Igor Gritsyuk", email = "gritsyuk.igor@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9,<4",
    "pydantic>=2.6,<3",
]
keywords = ["tehzor", "api", "construction", "supervision", "inspections", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2", "pyyaml>=6"]
dev = [
    "mcp>=1.2,<2",
    "pyyaml>=6",
    "types-PyYAML",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7.6",
    # aioresponses 0.7.9 несовместим с aiohttp 3.14 (ClientResponse(stream_writer=...)); снять, когда починят
    "aiohttp<3.14",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
tehzor-mcp = "tehzor.mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/gritsyuk/tehzor"
Documentation = "https://api.tehzor.ru/docs"

[tool.hatch.version]
path = "tehzor/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["tehzor"]

[tool.hatch.build.targets.sdist]
include = ["tehzor", "README.md", "LICENSE.txt", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "A", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["tehzor"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# изменяющие методы возвращают результат общего _write (Any); типы задают overload-сигнатуры
module = "tehzor.resources.*"
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not contract'"
markers = [
    "contract: живое API, только чтение (нужен доступ к api.tehzor.ru)",
]
